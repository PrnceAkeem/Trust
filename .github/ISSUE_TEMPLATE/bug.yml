name: Bug report
description: Report reproducible behavior that differs from an accepted requirement.
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include real organizational data here. Follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what operational impact did it have?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Trust revision, operating systems, deployment shape, and relevant configuration using synthetic values.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant logs or measurements with secrets, identities, addresses, and private data removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secrets, personal data, or real internal infrastructure details.
          required: true
        - label: This is not a security vulnerability.
          required: true
